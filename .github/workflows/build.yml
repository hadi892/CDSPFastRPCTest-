name: Build CDSPFastRPCTest Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 'current'
          cache-read-only: false

      - name: Accept Android SDK Licenses & Setup Environment
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses || true

      - name: Build APK with Gradle
        run: |
          # Ensure gradlew exists or generate it
          if [ -f "./gradlew" ]; then
            echo "Found ./gradlew in root"
            chmod +x ./gradlew
            ./gradlew assemble --stacktrace --no-daemon
          elif [ -f "$(find . -name gradlew | head -n 1)" ]; then
            GW_PATH=$(find . -name gradlew | head -n 1)
            echo "Found gradlew at: $GW_PATH"
            chmod +x "$GW_PATH"
            DIR_PATH=$(dirname "$GW_PATH")
            cd "$DIR_PATH"
            ./gradlew assemble --stacktrace --no-daemon
          else
            echo "Generating Gradle wrapper..."
            gradle wrapper || true
            if [ -f "./gradlew" ]; then
              chmod +x ./gradlew
              ./gradlew assemble --stacktrace --no-daemon
            else
              gradle assemble --stacktrace --no-daemon
            fi
          fi

      - name: Locate and Prepare Release APK
        run: |
          mkdir -p app/build/outputs/apk/release
          echo "Searching for generated APK files..."
          find . -name "*.apk"
          
          # Find best candidate APK
          RELEASE_APK=$(find . -type f -name "*release*.apk" | head -n 1)
          if [ -z "$RELEASE_APK" ]; then
            RELEASE_APK=$(find . -type f -name "*.apk" | head -n 1)
          fi
          
          if [ -n "$RELEASE_APK" ] && [ -f "$RELEASE_APK" ]; then
            echo "Selected APK: $RELEASE_APK"
            cp "$RELEASE_APK" app/build/outputs/apk/release/CDSPFastRPCTest-release.apk
            ls -la app/build/outputs/apk/release/CDSPFastRPCTest-release.apk
          else
            echo "ERROR: No APK was generated!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CDSPFastRPCTest-release-apk
          path: app/build/outputs/apk/release/CDSPFastRPCTest-release.apk
          if-no-files-found: error
          retention-days: 30
