name: Build CDSPFastRPCTest Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Generate Local Debug Keystore If Missing
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew

      - name: Build Release APK with Gradle 9.3.1
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Locate and Prepare Release APK
        run: |
          mkdir -p app/build/outputs/apk/release
          if [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ] && [ ! -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/app-release.apk
          fi
          if [ ! -f "app/build/outputs/apk/release/app-release.apk" ]; then
            APK_FOUND=$(find app/build/outputs/ -name "*.apk" | head -n 1)
            if [ -n "$APK_FOUND" ]; then
              echo "Found APK: $APK_FOUND, copying to release destination"
              cp "$APK_FOUND" app/build/outputs/apk/release/app-release.apk
            else
              echo "ERROR: No release APK found in build outputs!"
              exit 1
            fi
          fi
          ls -la app/build/outputs/apk/release/app-release.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CDSPFastRPCTest-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
