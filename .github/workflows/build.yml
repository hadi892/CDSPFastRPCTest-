name: Build CDSPFastRPCTest Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android SDK Licenses & Setup Environment
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses || true

      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew

      - name: Build APK with Gradle
        run: ./gradlew assemble --stacktrace --no-daemon

      - name: Locate and Prepare Release APK
        run: |
          mkdir -p app/build/outputs/apk/release
          echo "Listing all built APK files:"
          find app/build/outputs/ -name "*.apk"
          
          # Find best candidate APK
          RELEASE_APK=$(find app/build/outputs/apk/ -type f -name "*release*.apk" | head -n 1)
          if [ -z "$RELEASE_APK" ]; then
            RELEASE_APK=$(find app/build/outputs/apk/ -type f -name "*.apk" | head -n 1)
          fi
          
          if [ -n "$RELEASE_APK" ] && [ -f "$RELEASE_APK" ]; then
            echo "Selected APK: $RELEASE_APK"
            cp "$RELEASE_APK" app/build/outputs/apk/release/CDSPFastRPCTest-release.apk
            ls -la app/build/outputs/apk/release/CDSPFastRPCTest-release.apk
          else
            echo "ERROR: No APK was generated!"
            find app/build/ -name "*.apk" || true
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CDSPFastRPCTest-release-apk
          path: app/build/outputs/apk/release/CDSPFastRPCTest-release.apk
          if-no-files-found: error
          retention-days: 30
